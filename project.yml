name: KeyBored
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
options:
  bundleIdPrefix: com.tg-techie.app
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
settings:
  base:
    # No DEVELOPMENT_TEAM here on purpose: signing identity is the builder's, not the
    # project's. Set yours in Xcode's Signing & Capabilities, or pass
    # DEVELOPMENT_TEAM=... to xcodebuild. The project builds and tests without one:
    #   xcodebuild -scheme KeyBored -destination 'generic/platform=iOS Simulator' \
    #     CODE_SIGNING_ALLOWED=NO build
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.8"
    CURRENT_PROJECT_VERSION: "1"
    # The one place the user-facing name is written. The project, the targets, the bundle
    # identifiers and the repository are all still KeyBored; BoreKey is only what a person
    # sees — the app's name on the home screen, and the keyboard's name in Settings and in
    # the globe-key switcher. Both come from the setting below rather than from a literal
    # in either Info.plist, and Swift reads it back off the bundle in `Shared/Branding.swift`,
    # so renaming means editing this line.
    PRODUCT_DISPLAY_NAME: BoreKey
    INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
    # CFBundleName is the other name a person can see, and it cannot be set from the
    # Info.plist. With GENERATE_INFOPLIST_FILE on, Xcode writes CFBundleName =
    # $(PRODUCT_NAME) and merges it over whatever the hand-written plist says, silently;
    # there is no INFOPLIST_KEY_CFBundleName to override it with. So the product itself
    # is renamed, per target below, and CFBundleName follows. Builds 0.0.1 through 0.0.5
    # shipped CFBundleName = KeyBored for exactly this reason — read the archived
    # Info.plist to check this, never the one in the tree.
    #
    # PRODUCT_MODULE_NAME is pinned alongside each rename. Renaming a product renames its
    # Swift module too, and the module name is not a brand: it is what `@testable import
    # KeyBored` says in every test file, and the project is KeyBored.
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  KeyBored:
    type: application
    platform: iOS
    sources:
      - path: KeyBored
        excludes:
          - "AppIcon.icon"
      # Icon Composer writes a directory, not a file, so it has to be added explicitly as
      # a file reference; left to the folder scan above it would come in as a group and
      # actool would never see it. The name must match ASSETCATALOG_COMPILER_APPICON_NAME.
      - path: KeyBored/AppIcon.icon
        type: file
      - path: Shared
        excludes:
          - "Resources/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tg-techie.app.keybored
        PRODUCT_NAME: $(PRODUCT_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: KeyBored
        INFOPLIST_FILE: KeyBored/Info.plist
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KeyBoredKeyboard
        embed: true
  KeyBoredKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyBoredKeyboard
      - path: Shared
        excludes:
          - "Resources/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tg-techie.app.keybored.keyboard
        PRODUCT_NAME: $(PRODUCT_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: KeyBoredKeyboard
        INFOPLIST_FILE: KeyBoredKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: true
  KeyBoredTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KeyBoredTests
      - path: Shared
        excludes:
          - "Resources/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tg-techie.app.KeyBoredTests
        # Written out because xcodegen derives it from the *target* name and the product
        # is called BoreKey. Left to the default it evaluates to
        # `.../KeyBored.app/KeyBored`, which does not exist, and the failure is not a
        # build error: Xcode quietly declines to attach the test target to any scheme, so
        # `xcodebuild ... test` reports "Scheme KeyBored is not currently configured for
        # the test action" and the suite stops running rather than failing.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(PRODUCT_DISPLAY_NAME).app/$(PRODUCT_DISPLAY_NAME)
        # The other two targets carry hand-written Info.plists; the test bundle has no
        # need of one, so it gets a generated one rather than a file to keep in step.
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: KeyBored

# The scheme is written down rather than left to Xcode to autocreate.
#
# Autocreation is not part of the project: it happens the first time a tool opens the
# generated `.xcodeproj`, and what it decides is not visible in anything tracked here.
# Renaming the products to BoreKey was enough to make it stop attaching KeyBoredTests to
# the KeyBored scheme, so `xcodebuild ... test` began failing with "Scheme KeyBored is
# not currently configured for the test action" on a project that had just built and
# whose test target had not been touched. A scheme that is generated from this file
# cannot drift that way.
schemes:
  KeyBored:
    build:
      targets:
        KeyBored: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeyBoredTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
